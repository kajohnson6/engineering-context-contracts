[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "engineering-context-contracts"
version = "0.4.0"
description = "Provider-neutral contracts for engineering evidence exchange"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Engineering Context Contracts contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_context_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"canonicalization" = "engineering_context_contracts/canonicalization"
"fixtures" = "engineering_context_contracts/fixtures"
"schemas" = "engineering_context_contracts/schemas"
"CONTRACT-MANIFEST.json" = "engineering_context_contracts/CONTRACT-MANIFEST.json"

[tool.hatch.build.targets.sdist]
include = [
  "/canonicalization",
  "/fixtures",
  "/schemas",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/CONTRACT-MANIFEST.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
